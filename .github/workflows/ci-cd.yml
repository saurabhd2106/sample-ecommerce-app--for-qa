name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  VM_HOST: 34.200.249.158
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/saurabhd2106/oakline-backend
  FRONTEND_IMAGE: ghcr.io/saurabhd2106/oakline-frontend
  JAVA_VERSION: "21"
  NODE_VERSION: "22"

jobs:
  backend-build-test:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build and run unit tests
        run: mvn -B verify

      - name: Upload backend jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  frontend-build-test:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  sonar-backend:
    name: SonarQube — backend
    runs-on: ubuntu-latest
    needs: backend-build-test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Analyze with SonarQube
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=oakline-backend
          -Dsonar.projectName=Oakline Backend
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
          -Dsonar.token=${{ secrets.SONAR_TOKEN }}

  sonar-frontend:
    name: SonarQube — frontend
    runs-on: ubuntu-latest
    needs: frontend-build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=oakline-frontend
            -Dsonar.projectName=Oakline Frontend
            -Dsonar.sources=src
            -Dsonar.exclusions=**/*.svg,**/*.css

  publish-backend:
    name: Publish backend image
    runs-on: ubuntu-latest
    needs: [backend-build-test, sonar-backend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download backend jar
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  publish-frontend:
    name: Publish frontend image
    runs-on: ubuntu-latest
    needs: [frontend-build-test, sonar-frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest

  deploy:
    name: Deploy to AWS VM
    runs-on: ubuntu-latest
    needs: [publish-backend, publish-frontend]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy directory on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: mkdir -p ~/oakline

      - name: Copy compose file to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: oakline/
          strip_components: 1

      - name: Deploy containers on VM
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
        with:
          host: ${{ env.VM_HOST }}
          username: ${{ secrets.VM_SSH_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN,IMAGE_TAG,POSTGRES_PASSWORD,APP_JWT_SECRET
          script: |
            set -euo pipefail
            cd ~/oakline
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE_TAG
            export POSTGRES_PASSWORD="${POSTGRES_PASSWORD:-ecommerce}"
            export APP_JWT_SECRET="${APP_JWT_SECRET:-sample-ecommerce-demo-jwt-secret-key-must-be-long-enough-256bits}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
            docker logout ghcr.io || true

      - name: Wait for backend health
        run: |
          set -euo pipefail
          echo "Polling http://${VM_HOST}:8080/api/health ..."
          for i in $(seq 1 36); do
            if curl -sf "http://${VM_HOST}:8080/api/health" | grep -q '"status"[[:space:]]*:[[:space:]]*"UP"'; then
              echo "Backend is UP"
              exit 0
            fi
            echo "Attempt $i/36 — waiting 5s..."
            sleep 5
          done
          echo "Backend health check timed out"
          exit 1

      - name: Wait for frontend
        run: |
          set -euo pipefail
          echo "Polling http://${VM_HOST}/ ..."
          for i in $(seq 1 36); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://${VM_HOST}/" || true)
            if [ "$code" = "200" ]; then
              echo "Frontend returned 200"
              exit 0
            fi
            echo "Attempt $i/36 — got HTTP $code, waiting 5s..."
            sleep 5
          done
          echo "Frontend readiness check timed out"
          exit 1

  e2e-tests:
    name: Playwright E2E (${{ matrix.suite }})
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        suite: [api, ui]
    defaults:
      run:
        working-directory: tests
    env:
      CI: "true"
      BASE_URL: http://34.200.249.158
      API_URL: http://34.200.249.158:8080/api
      DEMO_USER: demo
      DEMO_PASSWORD: password1
      BROWSERS: chromium
      WORKERS: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint test format
        run: npm run lint:tests

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests (${{ matrix.suite }})
        run: npm run test:${{ matrix.suite }}

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-${{ matrix.suite }}
          path: |
            tests/reports/
            tests/test-results/
          if-no-files-found: ignore
          retention-days: 14
