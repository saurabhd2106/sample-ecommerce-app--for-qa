apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oakline
  namespace: oakline
spec:
  parentRefs:
    - name: oakline-gateway
      sectionName: http
  rules:
    # Backend endpoints already start with /api, so no path rewrite is needed.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
