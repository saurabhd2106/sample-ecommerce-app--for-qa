# Demo values only. Replace them (or source them from an external secrets
# manager such as Azure Key Vault) before any real use, and do not commit real secrets.
apiVersion: v1
kind: Secret
metadata:
  name: oakline-secrets
  namespace: oakline
type: Opaque
stringData:
  POSTGRES_PASSWORD: ecommerce
  # Must be at least 256 bits (32+ characters).
  APP_JWT_SECRET: sample-ecommerce-demo-jwt-secret-key-must-be-long-enough-256bits
