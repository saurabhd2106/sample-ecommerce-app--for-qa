apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oakline-gateway
  namespace: oakline
  labels:
    app.kubernetes.io/name: oakline-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: oakline
spec:
  gatewayClassName: eg
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: oakline-proxy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
