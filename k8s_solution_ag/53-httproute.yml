apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oakline
  namespace: oakline
  labels:
    app.kubernetes.io/name: oakline
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: oakline
spec:
  parentRefs:
    - name: oakline-gateway
      sectionName: http
  rules:
    # Backend endpoints already start with /api, so no path rewrite is needed.
    - name: api
      matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
      timeouts:
        request: 30s
    - name: web
      matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
      timeouts:
        request: 15s
