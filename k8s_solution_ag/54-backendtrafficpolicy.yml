apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: oakline
  namespace: oakline
  labels:
    app.kubernetes.io/name: oakline
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: oakline
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: oakline
  rateLimit:
    type: Local
    local:
      rules:
        # Per client IP; relies on externalTrafficPolicy: Local in 51-envoyproxy.yml.
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 100
            unit: Second
  # Only retry failures where the request never reached the app, so
  # non-idempotent calls (e.g. checkout POSTs) are never duplicated.
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset-before-request
    perRetry:
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
  timeout:
    tcp:
      connectTimeout: 5s
